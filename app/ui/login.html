<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="/ui/app-route-recover.js?v=1.4.46"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>VM Orchestrator · 登录</title>
<link rel="stylesheet" href="/ui/login.css?v=1.4.46">
<script src="/ui/login.js?v=1.4.46" defer></script>
</head>
<body>
<main class="login-container">
<form id="loginForm" class="login-card" autocomplete="off">
<div class="logo" aria-hidden="true">V</div>
<h1>VM Orchestrator</h1>

<label for="loginUser">账号</label>
<input id="loginUser" name="username" autocomplete="username" required autofocus placeholder="账号">
<label for="loginKey">密码</label>
<input id="loginKey" name="password" type="password" autocomplete="current-password" required placeholder="密码">
<button id="loginSubmit" type="submit">进入控制台</button>
<div id="loginError" class="error" role="alert" aria-live="polite"></div>

</form>
</main>
</body>
</html>
