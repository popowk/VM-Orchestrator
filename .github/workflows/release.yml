name: Publish verified VMO release
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vmo-release-main
  cancel-in-progress: false
jobs:
  windows-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify direct PowerShell 5.1 script invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $check = (Resolve-Path 'scripts/host/Test-GitHubUpdate.ps1').Path
          $source = (Resolve-Path 'scripts/host/Apply-GitHubUpdate.ps1').Path
          # Match the production updater: it stages a UTF-8 BOM copy because
          # Windows PowerShell 5.1 misreads UTF-8 source without BOM as ANSI.
          $updater = Join-Path $env:RUNNER_TEMP 'VMO-staged-updater.ps1'
          $updaterCode = [IO.File]::ReadAllText($source, [Text.Encoding]::UTF8)
          [IO.File]::WriteAllText($updater, $updaterCode, [Text.UTF8Encoding]::new($true))
          try {
            & $ps51 -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File $check -UpdaterPath $updater
            if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 -File preflight failed' }
            Write-Host 'PASS: Windows PowerShell 5.1 direct staged-script launch'
          } finally {
            Remove-Item -LiteralPath $updater -Force -ErrorAction SilentlyContinue
          }
      - name: Verify Windows portable process scanner is inspect-only by default
        shell: pwsh
        run: |
          $folder = 'C:\dsh\VMO-Test-App'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $binary = Join-Path $folder 'Test.exe'
          Set-Content -LiteralPath $binary -Value 'not executable; inspection only' -Encoding ASCII
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $script = (Resolve-Path 'guest_agent/Portable-Processes.ps1').Path
          $result = & $ps51 -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File $script -Mode Inspect -ProgramRoot $folder -Launcher 'Test.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Portable process inspect failed on Windows PowerShell 5.1' }
          $obj = $result | ConvertFrom-Json
          if ($obj.running -ne $false -or $obj.count -ne 0) { throw 'Inspection misidentified a process' }
          Remove-Item -LiteralPath $folder -Recurse -Force
  release:
    needs: windows-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify semantic version
        shell: bash
        run: |
          set -euo pipefail
          v=$(tr -d '\r\n' < VERSION)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Compile Python source before release
        run: python -m compileall -q app guest_agent
      - name: Regression - updater invocation uses inspectable scripts
        run: python -m unittest discover -s tests -p test_update_launch.py -v
      - name: Check admin JavaScript syntax
        run: node --check app/ui/admin.js
      - name: Regression - portable ZIP, versions and prior-running-state recovery
        run: python -m unittest discover -s tests -p test_portable_catalog.py -v
      - name: Regression test version consistency
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from app.system_updates import UpdateService, UpdateError

          with TemporaryDirectory() as temp:
              root = Path(temp)
              (root / "VERSION").write_text("1.4.45\n", encoding="utf-8")
              worker = UpdateService(root)
              worker.work.mkdir(parents=True)
              worker.status_file.write_text(json.dumps({
                  "state": "success", "mode": "restart",
                  "version": "1.4.46", "attempt": "a" * 32
              }), encoding="utf-8")
              assert worker.status()["update"]["state"] == "version_mismatch"
              assert worker.status()["current"] == "1.4.45"
              try:
                  worker.install("1.4.47")
                  raise AssertionError("Inconsistent installation allowed a new update")
              except UpdateError:
                  pass
              (root / "VERSION").write_text("1.4.46\n", encoding="utf-8")
              assert worker.status()["update"]["state"] == "version_mismatch"
              restarted = UpdateService(root)
              assert restarted.status()["update"]["state"] == "success"
              assert restarted.status()["disk_version"] == "1.4.46"
              (root / "VERSION").write_text("1.4.45\n", encoding="utf-8")
              assert restarted.status()["update"]["state"] == "version_mismatch"

          print("PASS: historical success cannot mask a stale running service")
          PY
      - name: Parse Windows PowerShell service scripts
        shell: pwsh
        run: |
          foreach ($file in @('scripts/host/Apply-GitHubUpdate.ps1',
                              'scripts/host/Test-GitHubUpdate.ps1',
                              'scripts/host/Control-VMOHost.ps1',
                              'guest_agent/Portable-Processes.ps1',
                              'guest_agent/Install-GuestAgentV2.ps1',
                              'scripts/guest/Install-OOBE-Bootstrap.ps1',
                              'scripts/guest/Prepare-TemplateGuest.ps1',
                              'scripts/guest/Seal-Win10Template.ps1',
                              'template_build/Export-GuestToolkit.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ': ' + $_.Message) }
              exit 1
            }
            Write-Host ("PASS: PowerShell parser accepted " + $file)
          }
      - name: Regression - PID zero and redacted WMI CommandLine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $file='scripts/host/Apply-GitHubUpdate.ps1'
          $code=Get-Content -LiteralPath $file -Raw -Encoding UTF8
          $start=$code.IndexOf('function Get-VerifiedVMOPid')
          $end=$code.IndexOf('function Probe-Version', $start)
          if ($start -lt 0 -or $end -le $start) { throw 'Missing verified Host PID helper' }
          Invoke-Expression $code.Substring($start, $end-$start)
          $Target=Join-Path $env:RUNNER_TEMP 'vmo-verify'
          New-Item -ItemType Directory -Path $Target -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $Target 'VERSION') -Value '1.4.47' -Encoding ASCII
          $global:mockPorts=$false
          $global:mockCmd=$null
          $global:mockHealthPid=4242
          function Get-NetTCPConnection {
            param([string]$State,[int]$LocalPort)
            if ($global:mockPorts) { [pscustomobject]@{OwningProcess=4242} }
          }
          function Get-CimInstance {
            param([string]$ClassName,[string]$Filter)
            if ($Filter -match 'ProcessId=0') { throw 'Cannot query System Idle PID 0' }
            [pscustomobject]@{Name='python.exe';CommandLine=$global:mockCmd}
          }
          function Invoke-RestMethod {
            param([string]$Uri,[int]$TimeoutSec)
            [pscustomobject]@{
              status='ok';phase=10;pid=$global:mockHealthPid
              capability='per-clone-oobe-template-bootstrap';version='1.4.47'
            }
          }
          if ((Get-VerifiedVMOPid '1.4.47' 0) -ne 0) {
            throw 'No listener with HostPid=0 must not query/stop any process'
          }
          $global:mockPorts=$true
          if ((Get-VerifiedVMOPid '1.4.47' 0) -ne 4242) {
            throw 'Expected verified Python process even with empty CommandLine'
          }
          $failed=$false
          try { Get-VerifiedVMOPid '1.4.47' 1000 | Out-Null } catch { $failed=$true }
          if (-not $failed) { throw 'Mismatched known PID must be rejected' }
          $global:mockHealthPid=999
          $failed=$false
          try { Get-VerifiedVMOPid '1.4.47' 0 | Out-Null } catch { $failed=$true }
          if (-not $failed) { throw 'Bad Host health PID must be rejected' }
          $global:mockHealthPid=4242
          $global:mockCmd='python.exe -m unrelated.module'
          $failed=$false
          try { Get-VerifiedVMOPid '1.4.47' 0 | Out-Null } catch { $failed=$true }
          if (-not $failed) { throw 'Non-VMO Python entrypoint must be rejected' }
          Write-Host 'PASS: zero PID and empty WMI CommandLine handled safely'
      - name: Install Pydantic for self-service model validation tests
        run: python -m pip install 'pydantic>=2,<3'
      - name: Regression - cleanup preview and delete guards
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Confirm launcher does not pause
        shell: bash
        run: |
          if grep -qiE '^[[:space:]]*pause[[:space:]]*$' Start-VM-Orchestrator.cmd; then
            echo "The launcher must exit when the Host stops" >&2
            exit 1
          fi
      - name: Verify cleanup UI and authenticated API integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('app/main.py').read_text(encoding='utf-8')
          html = Path('app/ui/index.html').read_text(encoding='utf-8')
          js = Path('app/ui/admin.js').read_text(encoding='utf-8')
          module = Path('app/cleanup.py')
          assert module.is_file(), 'Cleanup module missing'
          assert "from .cleanup import CleanupManager, CleanupError" in main
          assert "'/api/system/cleanup/scan'" in main
          assert "'/api/system/cleanup/delete'" in main
          assert "dependencies=[Depends(authorized)]" in main
          assert 'id="page-cleanup"' in html
          assert 'data-page="cleanup"' in html
          assert "VMOCleanup={scan}" in js
          assert "backup_deleted_at" in js
          print('PASS: cleanup UI and API are wired into this release')
          PY
      - name: Build release ZIP and SHA-256
        run: python tools/build_release.py
      - name: Publish only a new release version
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v=$(tr -d '\r\n' < VERSION)
          if gh release view "v${v}" >/dev/null 2>&1; then
            echo "Release v${v} already exists; keeping published artifacts unchanged."
            exit 0
          fi
          gh release create "v${v}" "dist/VM-Orchestrator-v${v}.zip" "dist/VM-Orchestrator-v${v}.zip.sha256" \
            --target "$GITHUB_SHA" --title "VM Orchestrator v${v}" --generate-notes
