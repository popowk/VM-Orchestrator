name: Publish a verified VMO release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          v=$(cat VERSION | tr -d '\r\n')
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "v$v" = "$GITHUB_REF_NAME"
          fi
      - name: Build release artifact and SHA-256 checksum
        run: python tools/build_release.py
      - name: Publish release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v=$(cat VERSION | tr -d '\r\n')
          if gh release view "v${v}" >/dev/null 2>&1; then
            echo "Release v${v} already exists; leaving it unchanged."
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            gh release create "v${v}" "dist/VM-Orchestrator-v${v}.zip" "dist/VM-Orchestrator-v${v}.zip.sha256" \
              --target "$GITHUB_SHA" --title "VM Orchestrator v${v}" --generate-notes
          else
            gh release create "v${v}" "dist/VM-Orchestrator-v${v}.zip" "dist/VM-Orchestrator-v${v}.zip.sha256" \
              --title "VM Orchestrator v${v}" --generate-notes --verify-tag
          fi
