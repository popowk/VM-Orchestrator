name: Publish verified VMO release
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vmo-release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify semantic version
        shell: bash
        run: |
          set -euo pipefail
          v=$(tr -d '\r\n' < VERSION)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Compile Python source before release
        run: python -m compileall -q app guest_agent
      - name: Check admin JavaScript syntax
        run: node --check app/ui/admin.js
      - name: Regression test version consistency
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from app.system_updates import UpdateService, UpdateError

          with TemporaryDirectory() as temp:
              root = Path(temp)
              (root / "VERSION").write_text("1.4.45\n", encoding="utf-8")
              worker = UpdateService(root)
              worker.work.mkdir(parents=True)
              worker.status_file.write_text(json.dumps({
                  "state": "success", "mode": "restart",
                  "version": "1.4.46", "attempt": "a" * 32
              }), encoding="utf-8")
              assert worker.status()["update"]["state"] == "version_mismatch"
              assert worker.status()["current"] == "1.4.45"
              try:
                  worker.install("1.4.47")
                  raise AssertionError("Inconsistent installation allowed a new update")
              except UpdateError:
                  pass
              (root / "VERSION").write_text("1.4.46\n", encoding="utf-8")
              assert worker.status()["update"]["state"] == "version_mismatch"
              restarted = UpdateService(root)
              assert restarted.status()["update"]["state"] == "success"
              assert restarted.status()["disk_version"] == "1.4.46"
              (root / "VERSION").write_text("1.4.45\n", encoding="utf-8")
              assert restarted.status()["update"]["state"] == "version_mismatch"

          print("PASS: historical success cannot mask a stale running service")
          PY
      - name: Parse Windows PowerShell update script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/host/Apply-GitHubUpdate.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PASS: PowerShell parser accepted updater"
      - name: Regression - PID zero and redacted WMI CommandLine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $file='scripts/host/Apply-GitHubUpdate.ps1'
          $code=Get-Content -LiteralPath $file -Raw -Encoding UTF8
          $start=$code.IndexOf('function Get-VerifiedVMOPid')
          $end=$code.IndexOf('function Probe-Version', $start)
          if ($start -lt 0 -or $end -le $start) { throw 'Missing verified Host PID helper' }
          Invoke-Expression $code.Substring($start, $end-$start)
          $Target=Join-Path $env:RUNNER_TEMP 'vmo-verify'
          New-Item -ItemType Directory -Path $Target -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $Target 'VERSION') -Value '1.4.47' -Encoding ASCII
          $global:mockPorts=$false
          $global:mockCmd=$null
          $global:mockHealthPid=4242
          function Get-NetTCPConnection {
            param([string]$State,[int]$LocalPort)
            if ($global:mockPorts) { [pscustomobject]@{OwningProcess=4242} }
          }
          function Get-CimInstance {
            param([string]$ClassName,[string]$Filter)
            if ($Filter -match 'ProcessId=0') { throw 'Cannot query System Idle PID 0' }
            [pscustomobject]@{Name='python.exe';CommandLine=$global:mockCmd}
          }
          function Invoke-RestMethod {
            param([string]$Uri,[int]$TimeoutSec)
            [pscustomobject]@{
              status='ok';phase=10;pid=$global:mockHealthPid
              capability='per-clone-oobe-template-bootstrap';version='1.4.47'
            }
          }
          if ((Get-VerifiedVMOPid '1.4.47' 0) -ne 0) {
            throw 'No listener with HostPid=0 must not query/stop any process'
          }
          $global:mockPorts=$true
          if ((Get-VerifiedVMOPid '1.4.47' 0) -ne 4242) {
            throw 'Expected verified Python process even with empty CommandLine'
          }
          $failed=$false
          try { Get-VerifiedVMOPid '1.4.47' 1000 | Out-Null } catch { $failed=$true }
          if (-not $failed) { throw 'Mismatched known PID must be rejected' }
          $global:mockHealthPid=999
          $failed=$false
          try { Get-VerifiedVMOPid '1.4.47' 0 | Out-Null } catch { $failed=$true }
          if (-not $failed) { throw 'Bad Host health PID must be rejected' }
          $global:mockHealthPid=4242
          $global:mockCmd='python.exe -m unrelated.module'
          $failed=$false
          try { Get-VerifiedVMOPid '1.4.47' 0 | Out-Null } catch { $failed=$true }
          if (-not $failed) { throw 'Non-VMO Python entrypoint must be rejected' }
          Write-Host 'PASS: zero PID and empty WMI CommandLine handled safely'
      - name: Build release ZIP and SHA-256
        run: python tools/build_release.py
      - name: Publish only a new release version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v=$(tr -d '\r\n' < VERSION)
          if gh release view "v${v}" >/dev/null 2>&1; then
            echo "Release v${v} already exists; keeping published artifacts unchanged."
            exit 0
          fi
          gh release create "v${v}" "dist/VM-Orchestrator-v${v}.zip" "dist/VM-Orchestrator-v${v}.zip.sha256" \
            --target "$GITHUB_SHA" --title "VM Orchestrator v${v}" --generate-notes
